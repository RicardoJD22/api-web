<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <clipPath id="circ"><circle cx="64" cy="64" r="63"/></clipPath>
  </defs>

  <!-- Fondo -->
  <circle cx="64" cy="64" r="64" fill="url(#bg)"/>

  <!-- ── Cola de ballena (silueta blanca) ──
       Dos aletas simétricas apuntando hacia arriba
       con muesca central en V y pedúnculo estrecho abajo
  -->
  <path clip-path="url(#circ)" fill="#e0f2fe"
    d="
      M 52 92
      C 40 80, 18 56, 12 28
      C  9 16, 16  8, 26 12
      C 36 16, 46 36, 55 62
      C 57 67, 60 71, 64 70
      C 68 71, 71 67, 73 62
      C 82 36, 92 16, 102 12
      C 112  8, 119 16, 116 28
      C 110 56, 88 80,  76 92
      C 72 96, 68 98,  64 97
      C 60 98, 56 96,  52 92
      Z
    "
  />

  <!-- Agua (tapa la base del pedúnculo) -->
  <path clip-path="url(#circ)" fill="url(#waterG)" opacity="0.92"
    d="M 0 96 C 32 84, 96 108, 128 96 L 128 128 L 0 128 Z"/>
  <path clip-path="url(#circ)" fill="#22d3ee" opacity="0.25"
    d="M 0 102 C 40 92, 88 112, 128 102 L 128 128 L 0 128 Z"/>

  <!-- Borde -->
  <circle cx="64" cy="64" r="62" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35"/>
</svg>
